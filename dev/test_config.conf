# === SANDBOX TEST CONFIGURATION ===
# Used only by dev/run_local.py. Every address is in 192.0.2.0/24
# (TEST-NET-1, reserved for documentation, never routed) and every MAC is a
# locally administered dummy. Email is left blank on purpose.
# @SANDBOX@ is replaced with the sandbox folder when the sandbox starts.

SENTINEL_HOSTS="192.0.2.101 192.0.2.102 192.0.2.103 192.0.2.104 192.0.2.105"
WOL_DELAY_MINUTES="1"
WOL_CONFIRM_TIMEOUT_MINUTES="3"
CLIENT_STALE_TIMEOUT_MINUTES="2"
UPS_STATE_FILE="@SANDBOX@/run/nut/virtual.device"
DEFAULT_BROADCAST_IP="192.0.2.255"
API_TOKEN="sandbox-test-token"
POWER_SIMULATION_MODE="false"
DEBUG_MODE="false"

# === VICTRON BATTERY MONITOR (VBM) INTEGRATION ===
BATTERY_ENABLED="false"
BATTERY_API_URL="http://127.0.0.1:5088"
BATTERY_API_TIMEOUT="2"
BATTERY_MAX_DATA_AGE="60"
BATTERY_CAPACITY_AH="100"
BATTERY_DECISION_MODE="observe"
BATTERY_DEFAULT_POWER_SOURCE="sentinel"
WOL_MAX_WAIT_MINUTES="30"

# === SMTP NOTIFICATIONS ===
SMTP_USE_TLS="auto"

# === NOTIFICATION SETTINGS ===
NOTIFY_POWER_FAIL="true"
NOTIFY_POWER_RESTORED="true"
NOTIFY_CLIENT_SHUTDOWN="true"
NOTIFY_CLIENT_STALE="true"
NOTIFY_APP_ERROR="true"
NOTIFY_SIMULATION_MODE="true"
NOTIFY_WOL_FAILURE="true"

# === WAKE-ON-LAN HOST DEFINITIONS ===

[WAKE_HOST_1]
NAME="Proxmox host"
IP="192.0.2.10"
MAC="02:00:00:00:00:10"
AUTO_WOL="true"
IGNORE_SIMULATION="false"
SHUTDOWN_DELAY_MINUTES="0"

[WAKE_HOST_2]
NAME="NAS"
IP="192.0.2.11"
MAC="02:00:00:00:00:11"
AUTO_WOL="true"
IGNORE_SIMULATION="false"
SHUTDOWN_DELAY_MINUTES="2"

[WAKE_HOST_3]
NAME="Raspberry Pi"
IP="192.0.2.12"
MAC="02:00:00:00:00:12"
AUTO_WOL="false"
IGNORE_SIMULATION="true"
SHUTDOWN_DELAY_MINUTES="1"

[WAKE_HOST_4]
NAME="Media PC"
IP="192.0.2.13"
MAC="02:00:00:00:00:13"
AUTO_WOL="true"
IGNORE_SIMULATION="false"

# === POWER OUTAGE SIMULATION SCHEDULES ===

[SCHEDULE_1]
NAME="Weekly test"
TYPE="recurring"
TIME="03:00"
ACTION="start"
ENABLED="false"
DAY_OF_WEEK="sunday"

[SCHEDULE_2]
NAME="Weekly test end"
TYPE="recurring"
TIME="03:10"
ACTION="stop"
ENABLED="false"
DAY_OF_WEEK="sunday"
