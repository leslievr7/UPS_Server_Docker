# power_manager.py already writes every check to /var/log/power_manager.log.
# Without this rule rsyslog writes the same lines again to /var/log/syslog and
# /var/log/user.log, doubling the writes to the SD card.
#
# Files in /etc/rsyslog.d/ run in name order, before the main rules in
# /etc/rsyslog.conf. The "zz-" prefix puts this after custom.conf, so optional
# log forwarding (rsyslog/custom.conf) still receives these messages.
if $programname == 'PowerManager' then stop
